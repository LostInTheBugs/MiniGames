<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frogger</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🐸%3C/text%3E%3C/svg%3E">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: #101418;
    color: #8f8;
    font-family: "Courier New", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    user-select: none;
    touch-action: manipulation;
    padding-bottom: 12px;
  }
  .titlebar {
    display: flex; align-items: center; justify-content: center;
    gap: 14px; margin: 12px 0 6px;
    width: 100%; max-width: min(880px, calc(100vw - 24px));
  }
  #music-btn {
    border: 2px solid #2c3a2c; border-radius: 10px;
    background: #16211a; color: #7be87b;
    font-size: 18px; line-height: 1;
    padding: 6px 10px; cursor: pointer;
    box-shadow: 0 4px 12px rgba(0,0,0,.4);
  }
  #music-btn:active { transform: scale(.94); }
  #music-btn.off { opacity: .55; }
  h1 {
    margin: 0;
    font-size: 22px;
    letter-spacing: 6px;
    color: #7be87b;
    text-shadow: 0 0 12px rgba(123,232,123,.35);
  }
  #wrap {
    position: relative;
    width: 100%;
    max-width: min(880px, calc(100vw - 24px));
  }
  canvas {
    display: block;
    width: 100%;
    height: auto;
    border: 2px solid #2c3a2c;
    border-radius: 4px;
    box-shadow: 0 6px 24px rgba(0,0,0,.55);
    background: #111;
  }
  #overlay {
    position: absolute; inset: 0;
    display: none;
    align-items: center; justify-content: center;
    text-align: center;
    background: rgba(5,8,5,.78);
    flex-direction: column;
    padding: 20px;
    border-radius: 2px;
  }
  #overlay.show { display: flex; }
  #overlay h2 {
    font-size: 28px; margin: 0 0 12px;
    letter-spacing: 3px;
    color: #7be87b;
  }
  #overlay p { font-size: 15px; line-height: 1.6; color: #cfe8cf; }
  .hint { margin-top: 8px; font-size: 12px; color: #7a8a7a; }
  #dpad {
    display: none;
    margin: 10px auto 4px;
    grid-template-columns: repeat(3, 64px);
    grid-template-rows: 64px 64px;
    gap: 6px;
  }
  #dpad button {
    border: 2px solid #2c3a2c;
    border-radius: 10px;
    background: #16211a;
    color: #7be87b;
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
    touch-action: none;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 4px 12px rgba(0,0,0,.4);
  }
  #dpad button:active { background: #1f3324; transform: scale(.94); }
  #dpad .up    { grid-column: 2; grid-row: 1; }
  #dpad .left  { grid-column: 1; grid-row: 2; }
  #dpad .down  { grid-column: 2; grid-row: 2; }
  #dpad .right { grid-column: 3; grid-row: 2; }
  .menu-btn {
    display: block;
    width: 210px; margin: 10px auto;
    padding: 10px;
    border: 2px solid #2c3a2c;
    border-radius: 8px;
    background: #16211a;
    color: #cfe8cf;
    font-family: inherit; font-size: 15px;
    cursor: pointer;
  }
  .menu-btn:hover { background: #1f3324; border-color: #3a4a3a; }
  .menu-btn b { color: #7be87b; letter-spacing: 1px; }
  .menu-btn small { color: #7a8a7a; }
  .menu-btn.sel { border-color: #46c046; background: #1c3320; box-shadow: 0 0 14px rgba(70,192,70,.35); }
  @media (pointer: coarse), (max-width: 700px) {
    #dpad { display: grid; }
  }
</style>
</head>
<body>
<div class="titlebar">
  <h1>F R O G G E R</h1>
  <button id="music-btn" aria-label="musique">🔊</button>
</div>
<div id="wrap">
  <canvas id="game" width="440" height="350"></canvas>
  <div id="overlay">
    <h2 id="ov-title"></h2>
    <p id="ov-text"></p>
    <div id="ov-buttons"></div>
  </div>
</div>
<div id="dpad">
  <button data-dir="0,-1" class="up" aria-label="haut">▲</button>
  <button data-dir="-1,0" class="left" aria-label="gauche">◀</button>
  <button data-dir="0,1" class="down" aria-label="bas">▼</button>
  <button data-dir="1,0" class="right" aria-label="droite">▶</button>
</div>
<div class="hint">Flèches : déplacer la grenouille · 4 grenouilles pour gagner</div>

<script>
"use strict";

// ---------- Grille ----------
const COLS = 22, ROWS = 16, CELL = 20;
const Y_OFF = 30; // bandeau HUD en haut du canvas
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const SS = 2; // résolution interne 2× : plus grand ET net sur ordinateur
canvas.width = 440 * SS;
canvas.height = 350 * SS;
ctx.scale(SS, SS);

// Zones (lignes) : 0 = maisons, 1-2 herbe haut, 3-4 rivière, 5 médiane, 6-10 route, 11-15 herbe bas
const RIVER_ROWS = [3, 4];
const ROAD_ROWS = [6, 7, 8, 9, 10];
const HOUSE_COLS = [1, 5, 9, 13, 17, 21]; // 6 emplacements
const TARGETS_NEEDED = 4;
const W = 440; // largeur logique (le canvas interne est 2× via SS)

// ---------- État ----------
let frog, score, lives, crossings, timer;
let cars, logs;
let carWait, logWait;
let state; // "menu" | "play" | "dead" | "over"
let frame = 0;
let usedHouses = []; // colonnes des maisons déjà occupées
let popups = [];    // textes flottants (+100)
let endAnim = null; // animation de fin en cours { type, t, dur, cb, ... }

const CAR_COLORS = ["#e74c3c", "#f1c40f", "#3498db", "#e67e22", "#9b59b6", "#dfe4ea", "#2ecc71"];

// ---------- Difficultés ----------
// VITESSE : multiplicateur de vitesse des voitures/bûches
// SPAWN   : intervalle (frames) minimum avant une nouvelle voiture
// TEMPS   : frames par traversée (60 = 1 s)
const DIFFS = [
  { name: "FACILE",      sub: "trafic calme · 90 s",  speed: 0.7,  spawn: 120, timerMax: 5400 },
  { name: "MEDIUM",      sub: "traversée classique",  speed: 1.0,  spawn: 60,  timerMax: 3600 },
  { name: "DIFFICILE",   sub: "trafic dense · 45 s",  speed: 1.45, spawn: 24,  timerMax: 2700 },
];
let diffIdx = 1;
let timerMax = DIFFS[diffIdx].timerMax;
const LANE_SPEEDS = [1.0, 1.3, 1.6, 1.3, 1.0]; // pixels/tick par voie (× vitesse difficulté)
const LOG_SPEEDS = [1.2, -1.5]; // rivière ligne 3 vers droite, ligne 4 vers gauche

function reset() {
  score = 0; lives = 4; crossings = 0;
  usedHouses = [];
  popups = [];
  endAnim = null;
  timerMax = DIFFS[diffIdx].timerMax;
  spawnFrog();
  spawnCarsAndLogs();
  timer = 0;
  state = "play";
  hideOverlay();
}

function spawnFrog() {
  frog = {
    x: Math.floor((COLS / 2 - 0.5) * CELL),
    y: 15 * CELL,
    onLog: null
  };
}

function spawnCarsAndLogs() {
  cars = [];
  logs = [];
  carWait = 0;
  logWait = 0;
  for (const row of RIVER_ROWS) {
    for (let k = 0; k < 3; k++) {
      const len = 3 * CELL;
      const x = Math.random() * (COLS * CELL - len);
      logs.push({ row, x, len });
    }
  }
}

function laneDir(row) { // 0 = vers droite, 1 = vers gauche
  return ROAD_ROWS.indexOf(row) % 2 === 0 ? 0 : 1;
}

// ---------- Fonds pré-rendus (herbe / asphalte) ----------
let grassTop, grassMid, grassBottom, asphalt;

function buildTextures() {
  // Herbe : base + taches claires/sombres
  const mkGrass = (h) => {
    const c = document.createElement("canvas");
    c.width = W * SS; c.height = h * SS;
    const g = c.getContext("2d");
    g.scale(SS, SS);
    g.fillStyle = "#1c631c";
    g.fillRect(0, 0, W, h);
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < h / 3 * 22; i++) {
      g.fillStyle = rnd() < 0.5 ? "#175617" : "#237023";
      g.fillRect(Math.floor(rnd() * W), Math.floor(rnd() * h), 3, 2);
    }
    return c;
  };
  grassTop = mkGrass(3 * CELL);
  grassMid = mkGrass(CELL);
  grassBottom = mkGrass(5 * CELL);

  // Asphalte : base + grain + pointillés entre voies
  const h = 5 * CELL;
  const c = document.createElement("canvas");
  c.width = W * SS; c.height = h * SS;
  const g = c.getContext("2d");
  g.scale(SS, SS);
  g.fillStyle = "#3b3d40";
  g.fillRect(0, 0, W, h);
  let seed = 21;
  const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 900; i++) {
    g.fillStyle = rnd() < 0.5 ? "#35373a" : "#43464a";
    g.fillRect(Math.floor(rnd() * W), Math.floor(rnd() * h), 2, 1);
  }
  // pointillés blancs au centre de chaque voie
  g.fillStyle = "#d8d8d8";
  for (let r = 0; r < ROAD_ROWS.length; r++) {
    const y = r * CELL + CELL / 2;
    for (let x = 0; x < W; x += 20) g.fillRect(x, y - 1, 10, 2);
  }
  asphalt = c;
}

// ---------- Dessin ----------
function draw() {
  // herbe haut
  ctx.drawImage(grassTop, 0, Y_OFF, W, 3 * CELL);
  // rivière (fond + animation)
  ctx.fillStyle = "#155a8a";
  ctx.fillRect(0, Y_OFF + 3 * CELL, W, 2 * CELL);
  drawWater();
  // médiane
  ctx.drawImage(grassMid, 0, Y_OFF + 5 * CELL, W, CELL);
  // route
  ctx.drawImage(asphalt, 0, Y_OFF + 6 * CELL, W, 5 * CELL);
  // herbe bas
  ctx.drawImage(grassBottom, 0, Y_OFF + 11 * CELL, W, 5 * CELL);

  // maisons / nénuphars
  for (const c of HOUSE_COLS) drawHouse(c, usedHouses.includes(c));

  // bûches
  for (const l of logs) drawLog(l);

  // voitures
  for (const c of cars) drawCar(c);

  // grenouille (flash rouge quand morte)
  if (state === "play" || state === "menu" || (state === "dead" && endAnim && endAnim.t % 12 < 7)) drawFrog();

  // popups (+100)
  for (const p of popups) {
    ctx.globalAlpha = Math.min(1, p.t / 40);
    ctx.fillStyle = "#ffec7b";
    ctx.font = "bold 14px monospace";
    ctx.fillText(p.text, p.x, Y_OFF + p.y);
    ctx.globalAlpha = 1;
  }

  drawEndAnim();
  drawHud();

  if (state === "dead") {
    ctx.fillStyle = "rgba(0,0,0,0.45)";
    ctx.fillRect(0, Y_OFF + 15 * CELL - 22, W, 22);
    ctx.fillStyle = "#ff6b6b";
    ctx.font = "bold 13px monospace";
    const msg = deadReason === "car" ? "Écrasé par une voiture !"
              : deadReason === "water" ? "Tombé à l'eau !"
              : deadReason === "time" ? "Manque de temps !"
              : "";
    ctx.fillText(msg, 8, Y_OFF + 15 * CELL - 7);
  }
}

function drawWater() {
  const y0 = Y_OFF + 3 * CELL, hh = 2 * CELL;
  // dégradé sombre en bas
  ctx.fillStyle = "#124f7a";
  ctx.fillRect(0, y0 + hh - 6, W, 6);
  // vagues animées
  ctx.strokeStyle = "rgba(255,255,255,0.16)";
  ctx.lineWidth = 1;
  for (let w = 0; w < 3; w++) {
    ctx.beginPath();
    const baseY = y0 + 5 + w * 11;
    for (let x = 0; x <= W; x += 8) {
      const y = baseY + Math.sin((x + frame * (1 + w * 0.3)) * 0.08 + w * 2) * 2;
      if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  // reflets scintillants
  ctx.fillStyle = "rgba(255,255,255,0.35)";
  for (let i = 0; i < 26; i++) {
    const x = (i * 97) % W;
    const y = y0 + 3 + ((i * 53) % (hh - 6));
    const a = 0.2 + 0.3 * Math.abs(Math.sin(frame * 0.12 + i * 1.7));
    ctx.globalAlpha = a;
    ctx.fillRect(x, y, 2, 1);
  }
  ctx.globalAlpha = 1;
}

function drawHouse(col, filled) {
  const x = col * CELL, y = Y_OFF + 0;
  const cx = x + CELL / 2, cy = y + CELL / 2 + 1;
  // nénuphar
  ctx.fillStyle = "#2f9e2f";
  ctx.beginPath();
  ctx.arc(cx, cy, 9, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#3fbf3f";
  ctx.beginPath();
  ctx.arc(cx, cy, 6.5, 0, Math.PI * 2);
  ctx.fill();
  // entaillement (en V)
  ctx.fillStyle = "#1c631c";
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + 10, cy - 5);
  ctx.lineTo(cx + 10, cy + 5);
  ctx.closePath();
  ctx.fill();
  if (filled) {
    // grenouille assise
    ctx.fillStyle = "#5c5";
    ctx.fillRect(x + 6, y + 7, 8, 7);
    ctx.fillStyle = "#fff";
    ctx.fillRect(x + 7, y + 8, 2, 2); ctx.fillRect(x + 11, y + 8, 2, 2);
    ctx.fillStyle = "#000";
    ctx.fillRect(x + 8, y + 9, 1, 1); ctx.fillRect(x + 12, y + 9, 1, 1);
  }
}

function drawLog(l) {
  const x = l.x, y = Y_OFF + l.row * CELL + 4, len = l.len, h = CELL - 8;
  // corps
  ctx.fillStyle = "#8b5a2b";
  ctx.fillRect(x, y, len, h);
  // bouts ronds
  ctx.beginPath();
  ctx.arc(x + h / 2, y + h / 2, h / 2, Math.PI / 2, Math.PI * 1.5);
  ctx.arc(x + len - h / 2, y + h / 2, h / 2, -Math.PI / 2, Math.PI / 2);
  ctx.fill();
  // relief
  ctx.fillStyle = "#a96d35";
  ctx.fillRect(x + 3, y + 1, len - 6, 3);
  // anneau (buche tronquée)
  ctx.strokeStyle = "#6b421d";
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(x + len - 4, y + h / 2, 3, 0, Math.PI * 2);
  ctx.stroke();
}

function drawCar(c) {
  const x = c.x, y = Y_OFF + c.row * CELL;
  // ombre
  ctx.fillStyle = "rgba(0,0,0,0.3)";
  ctx.fillRect(x + 2, y + CELL - 4, CELL - 4, 3);
  // carrosserie
  ctx.fillStyle = c.color;
  ctx.fillRect(x + 2, y + 6, CELL - 4, CELL - 10);
  // toit
  ctx.fillRect(x + 4, y + 4, CELL - 8, 4);
  // vitres
  ctx.fillStyle = "rgba(220,240,255,0.75)";
  ctx.fillRect(x + 5, y + 5, 3, 3);
  ctx.fillRect(x + CELL - 8, y + 5, 3, 3);
  // roues
  ctx.fillStyle = "#111";
  ctx.beginPath();
  ctx.arc(x + 5, y + CELL - 5, 2.2, 0, Math.PI * 2);
  ctx.arc(x + CELL - 5, y + CELL - 5, 2.2, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#888";
  ctx.beginPath();
  ctx.arc(x + 5, y + CELL - 5, 0.8, 0, Math.PI * 2);
  ctx.arc(x + CELL - 5, y + CELL - 5, 0.8, 0, Math.PI * 2);
  ctx.fill();
  // phares / feux
  if (c.dir === 0) {
    ctx.fillStyle = "#fff3a0"; ctx.fillRect(x + CELL - 3, y + 7, 2, 3); // phares à droite
    ctx.fillStyle = "#ff5050"; ctx.fillRect(x + 2, y + 7, 1, 3);       // feux arrière à gauche
  } else {
    ctx.fillStyle = "#fff3a0"; ctx.fillRect(x + 2, y + 7, 2, 3);
    ctx.fillStyle = "#ff5050"; ctx.fillRect(x + CELL - 3, y + 7, 1, 3);
  }
}

function drawFrog() {
  const x = frog.x, y = Y_OFF + frog.y;
  const cx = x + CELL / 2, cy = y + CELL / 2;
  // pattes arrière
  ctx.fillStyle = "#2e9e2e";
  ctx.beginPath();
  ctx.arc(x + 6, y + 15, 3, 0, Math.PI * 2);
  ctx.arc(x + 14, y + 15, 3, 0, Math.PI * 2);
  ctx.fill();
  // corps
  ctx.fillStyle = "#46c046";
  ctx.beginPath();
  ctx.ellipse(cx, cy + 1, 5.5, 6, 0, 0, Math.PI * 2);
  ctx.fill();
  // tête
  ctx.beginPath();
  ctx.arc(cx, y + 7, 5, 0, Math.PI * 2);
  ctx.fill();
  // yeux
  ctx.fillStyle = "#fff";
  ctx.beginPath();
  ctx.arc(cx - 3, y + 5, 2.4, 0, Math.PI * 2);
  ctx.arc(cx + 3, y + 5, 2.4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.arc(cx - 3, y + 5, 1, 0, Math.PI * 2);
  ctx.arc(cx + 3, y + 5, 1, 0, Math.PI * 2);
  ctx.fill();
  // reflet
  ctx.fillStyle = "rgba(255,255,255,0.5)";
  ctx.fillRect(cx - 1, y + 4, 1, 1);
}

function drawHud() {
  ctx.fillStyle = "#0d110d";
  ctx.fillRect(0, 0, W, Y_OFF);
  ctx.fillStyle = "#2c3a2c";
  ctx.fillRect(0, Y_OFF - 1, W, 1);
  ctx.font = "bold 13px monospace";

  // Score
  ctx.fillStyle = "#8f8";
  ctx.fillText("SCORE " + String(score).padStart(4, "0"), 8, 20);

  // Vies (pastilles)
  ctx.fillStyle = "#8f8";
  ctx.fillText("VIES", 118, 20);
  for (let i = 0; i < 4; i++) {
    const on = i < lives;
    ctx.fillStyle = on ? "#46c046" : "#2a2a2a";
    ctx.beginPath();
    ctx.arc(166 + i * 12, 15, 4, 0, Math.PI * 2);
    ctx.fill();
  }

  // Temps
  const t = Math.ceil((timerMax - timer) / 60);
  ctx.fillStyle = t <= 10 ? "#ff6b6b" : "#8f8";
  ctx.fillText("TEMPS " + String(Math.max(0, t)).padStart(2, "0"), 252, 20);

  // Traversées
  ctx.fillStyle = "#8f8";
  ctx.fillText("TRAV " + crossings + "/" + TARGETS_NEEDED, 352, 20);
}

// ---------- Animations de fin (victoire / mort / temps écoulé) ----------
function startEndAnim(type, dur, onDone) {
  const a = { type, t: 0, dur, onDone };
  if (type === "win") {
    a.parts = [];
    const colors = ["#ff5252", "#ffd740", "#69f0ae", "#40c4ff", "#e040fb", "#ff6e40"];
    for (let i = 0; i < 80; i++) {
      a.parts.push({
        x: Math.random() * W,
        y: -Math.random() * 160,
        vx: (Math.random() - 0.5) * 1.2,
        vy: 1 + Math.random() * 2.4,
        rot: Math.random() * Math.PI * 2,
        vrot: (Math.random() - 0.5) * 0.35,
        size: 4 + Math.random() * 6,
        color: colors[i % colors.length],
        shape: Math.random() < 0.5 ? 0 : 1
      });
    }
  }
  if (type === "time") {
    a.sand = [];
    for (let i = 0; i < 46; i++) {
      a.sand.push({ x: W / 2 - 14 + Math.random() * 28, y: Y_OFF + 130 - Math.random() * 30, vy: 0.6 + Math.random() * 0.9 });
    }
  }
  endAnim = a;
}

function drawEndAnim() {
  const a = endAnim;
  if (!a) return;
  const p = a.t / a.dur;                 // progression 0..1
  const cx = W / 2, cy = Y_OFF + 150;    // centre du canvas
  const pop = Math.min(1, p * 2.5);     // effet d'apparition
  const scale = (0.6 + 0.4 * pop) * (1 + 0.05 * Math.sin(a.t * 0.15));
  ctx.save();

  if (a.type === "dead") {
    // tremblement d'écran + vignette rouge pulsante
    const sh = (1 - p) * 7;
    ctx.translate((Math.random() - 0.5) * sh, (Math.random() - 0.5) * sh);
    const vg = ctx.createRadialGradient(cx, cy, 30, cx, cy, 290);
    vg.addColorStop(0, "rgba(120,0,0,0)");
    vg.addColorStop(1, "rgba(170,0,0," + (0.55 * (1 - p) + 0.08 * Math.sin(a.t * 0.6)) + ")");
    ctx.fillStyle = vg;
    ctx.fillRect(-40, -40, W + 80, 430);
  }

  ctx.globalAlpha = Math.min(1, pop * 1.3);
  ctx.textAlign = "center";

  if (a.type === "win") {
    for (const c of a.parts) {
      ctx.save();
      ctx.translate(c.x, c.y);
      ctx.rotate(c.rot);
      ctx.fillStyle = c.color;
      if (c.shape === 0) ctx.fillRect(-c.size / 2, -c.size / 4, c.size, c.size / 2);
      else { ctx.beginPath(); ctx.arc(0, 0, c.size / 2, 0, Math.PI * 2); ctx.fill(); }
      ctx.restore();
    }
    const bounce = Math.abs(Math.sin(a.t * 0.12)) * 14 * (1 - p * 0.3);
    ctx.font = (62 * scale) + "px monospace";
    ctx.fillText("🏆", cx, cy - bounce);
    ctx.globalAlpha = Math.min(1, pop);
    ctx.font = "bold 20px monospace";
    ctx.fillStyle = "#ffd740";
    ctx.fillText("BRAVO !", cx, cy + 42);
  } else if (a.type === "dead") {
    ctx.font = (74 * scale) + "px monospace";
    ctx.fillText("💀", cx, cy);
    ctx.globalAlpha = Math.min(1, pop);
    ctx.font = "bold 22px monospace";
    ctx.fillStyle = "#ff6b6b";
    ctx.fillText("K.O.", cx, cy + 46);
  } else if (a.type === "time") {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(Math.sin(a.t * 0.08) * 0.3);
    ctx.font = (74 * scale) + "px monospace";
    ctx.fillText("⏳", 0, 0);
    ctx.restore();
    ctx.fillStyle = "rgba(255,215,0," + (0.8 * (1 - p)) + ")";
    for (const s of a.sand) ctx.fillRect(s.x, s.y, 2, 2);
    ctx.globalAlpha = Math.min(1, pop);
    ctx.font = "bold 18px monospace";
    ctx.fillStyle = "#ffd740";
    ctx.fillText("TEMPS ÉCOULÉ !", cx, cy + 52);
  }

  ctx.restore();
}

// ---------- Logique ----------
function die(reason) {
  state = "dead";
  deadReason = reason;
  lives--;
  sfx("death");
  const type = reason === "time" ? "time" : "dead";
  startEndAnim(type, type === "time" ? 90 : 75, function () {
    if (lives > 0) { spawnFrog(); state = "play"; }
    else gameOver();
  });
}

function gameOver() {
  state = "over";
  sfx("over");
  showOverlay("PARTIE TERMINÉE",
    "Score final : " + score + " · Traversées : " + crossings + "/" + TARGETS_NEEDED +
    "<br>Touche ou tap pour rejouer.");
  restartOnKey = true;
}

let deadReason = "";
let restartOnKey = false;

function tryMove(dx, dy) {
  if (state !== "play") return;
  let nx = frog.x, ny = frog.y;
  if (dx === 1) nx = Math.min(COLS * CELL - 2 * CELL, nx + CELL);
  if (dx === -1) nx = Math.max(CELL, nx - CELL);
  if (dy === -1) ny = Math.max(0, ny - CELL);
  if (dy === 1) ny = Math.min(15 * CELL, ny + CELL);
  frog.x = nx; frog.y = ny;
  sfx("jump");

  // Arrivée en haut ? (ligne des maisons = 0)
  if (frog.y === 0) {
    const col = Math.round(frog.x / CELL);
    if (HOUSE_COLS.includes(col) && !usedHouses.includes(col)) {
      score += 100;
      crossings++;
      usedHouses.push(col);
      sfx("home");
      popups.push({ x: col * CELL - 10, y: -14, t: 60, text: "+100" });
      if (crossings >= TARGETS_NEEDED) { win(); return; }
      spawnFrog();
    }
  }
}

function win() {
  state = "over";
  sfx("win");
  startEndAnim("win", 90, function () {
    showOverlay("VICTOIRE ! 🏆",
      "Vous avez fait traversé " + TARGETS_NEEDED + " grenouilles sans les écorcher !<br>" +
      "Score : " + score + "<br>Touche ou tap pour rejouer.");
    restartOnKey = true;
  });
}

function update() {
  frame++;
  const spd = DIFFS[diffIdx].speed;
  if (state === "play") {
    timer++;
    if (timer >= timerMax) { die("time"); return; }

    // bûches
    for (const l of logs) {
      l.x += LOG_SPEEDS[l.row - 3] * spd;
      if (l.x > COLS * CELL + 20) l.x = -l.len - 20;
      if (l.x < -l.len - 20) l.x = COLS * CELL + 20;
    }

    // grenouille sur bûche ? sinon noyade
    if (RIVER_ROWS.includes(Math.floor((frog.y + 10) / CELL))) {
      const row = Math.floor((frog.y + 10) / CELL);
      const fCx = frog.x + CELL / 2;
      const onLog = logs.find(l => l.row === row &&
        fCx > l.x && fCx < l.x + l.len);
      if (onLog) {
        frog.x += LOG_SPEEDS[row - 3] * spd;
        if (frog.x < 0) frog.x = 0;
        if (frog.x > COLS * CELL - CELL) frog.x = COLS * CELL - CELL;
      } else {
        die("water");
        return;
      }
    }

    // voitures
    for (const c of cars) {
      c.x += LANE_SPEEDS[ROAD_ROWS.indexOf(c.row)] * spd * (c.dir === 0 ? 1 : -1);
      if (c.dir === 0 && c.x > COLS * CELL) c.x = -CELL;
      if (c.dir === 1 && c.x < -CELL) c.x = COLS * CELL;
    }
    carWait--;
    if (carWait <= 0) {
      carWait = DIFFS[diffIdx].spawn + Math.floor(Math.random() * 60);
      const row = ROAD_ROWS[Math.floor(Math.random() * ROAD_ROWS.length)];
      cars.push({
        row, dir: laneDir(row),
        x: laneDir(row) === 0 ? -CELL : COLS * CELL,
        color: CAR_COLORS[Math.floor(Math.random() * CAR_COLORS.length)]
      });
    }
    cars = cars.filter(c => c.x > -CELL * 2 && c.x < COLS * CELL * 2);

    // collision voiture (même ligne + chevauchement horizontal au contact)
    for (const c of cars) {
      if (c.row === Math.round(frog.y / CELL) &&
          Math.abs((c.x + CELL / 2) - (frog.x + CELL / 2)) < CELL * 0.7) {
        die("car");
        return;
      }
    }
  } else if (state === "dead") {
    // la grenouille est morte ; l'animation de fin (endAnim) est gérée ci-dessous
  }

  // ---------- Animation de fin (victoire / mort / temps écoulé) ----------
  if (endAnim) {
    endAnim.t++;
    if (endAnim.type === "win") {
      for (const c of endAnim.parts) { c.y += c.vy; c.x += c.vx; c.rot += c.vrot; }
    }
    if (endAnim.type === "time") {
      for (const s of endAnim.sand) { s.y += s.vy; if (s.y > Y_OFF + 185) s.y = Y_OFF + 125; }
    }
    if (endAnim.t >= endAnim.dur) { const cb = endAnim.onDone; endAnim = null; if (cb) cb(); }
  }

  // popups
  for (const p of popups) { p.t--; p.y -= 0.5; }
  popups = popups.filter(p => p.t > 0);
}

// ---------- Audio (musique + SFX, WebAudio) ----------
let actx = null, master = null, musicOn = true, noiseBuf = null;
try { musicOn = (localStorage.getItem("frog_music") !== "0"); } catch (e) {}
const musicBtn = document.getElementById("music-btn");
function initAudio() {
  if (actx) { if (actx.state === "suspended") actx.resume(); return; }
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  master = actx.createGain();
  master.gain.value = musicOn ? 0.42 : 0;
  master.connect(actx.destination);
  // bruit blanc pour la voix "chac-chac" des voitures
  noiseBuf = actx.createBuffer(1, actx.sampleRate * 0.3, actx.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function tone(freq, dur, opts) {
  if (!actx || !musicOn) return;
  opts = opts || {};
  const t0 = actx.currentTime + (opts.delay || 0);
  const o = actx.createOscillator();
  o.type = opts.type || "square";
  o.frequency.value = freq;
  const g = actx.createGain();
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(opts.vol || 0.05, t0 + (opts.atk || 0.01));
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + (dur || 0.15));
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0 + (dur || 0.15) + 0.05);
}
function sfx(name) {
  if (!actx) return;
  if (name === "jump") tone(480, 0.08, { type: "triangle", vol: 0.12, atk: 0.005 });
  else if (name === "home") { tone(660, 0.09, { vol: 0.11 }); tone(990, 0.14, { delay: 0.07, vol: 0.11 }); }
  else if (name === "death") { tone(150, 0.2, { vol: 0.16, type: "sawtooth" }); tone(90, 0.32, { delay: 0.09, vol: 0.16, type: "sawtooth" }); }
  else if (name === "over") { tone(200, 0.5, { vol: 0.15, type: "sawtooth" }); }
  else if (name === "win") [523, 659, 784, 1047].forEach((f, i) => tone(f, 0.2, { delay: i * 0.12, vol: 0.13 }));
}
// Boucle musicale : accords en boucle (I–vi–IV–v), basse, voix de voitures
const CHORDS = [
  [130.81, 164.81, 196.00], // C : do mi sol
  [110.00, 130.81, 164.81], // Am : la do mi
  [87.31, 110.00, 130.81],  // F : fa la do
  [98.00, 123.47, 146.83],  // G : sol si ré
];
const PENT = [1.0, 1.2, 1.5, 2.0, 2.4, 3.0];
let musicStep = 0, nextBar = 0;
function playCarSound(row) {
  if (!actx || !musicOn) return;
  const t0 = actx.currentTime;
  const src = actx.createBufferSource(); src.buffer = noiseBuf;
  const bp = actx.createBiquadFilter(); bp.type = "bandpass";
  bp.frequency.value = 500 + row * 300; bp.Q.value = 6;
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.05, t0 + 0.05);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.35);
  src.connect(bp); bp.connect(g); g.connect(master);
  src.start(t0); src.stop(t0 + 0.4);
}
function scheduleMusic() {
  if (!actx || !musicOn) return;
  const BAR = 2.4, ahead = actx.currentTime + 0.6;
  while (nextBar < ahead) {
    const ch = CHORDS[musicStep % 4];
    ch.forEach((f, i) => tone(f, BAR * 0.92, { type: "triangle", vol: 0.05, delay: nextBar - actx.currentTime }));
    // petite mélodie (pentatonique) 1 note / 0.6 s
    for (let b = 0; b < 4; b++) {
      const m = PENT[(musicStep * 4 + b) % PENT.length] * ch[2];
      tone(m, 0.25, { type: "sine", vol: 0.05, delay: (nextBar - actx.currentTime) + b * 0.6 });
    }
    if (musicStep % 2 === 0) playCarSound(musicStep % 4 + 2); // voix de voiture sur certains accords
    nextBar += BAR; musicStep++;
  }
}
function updateMusic() {
  if (!actx || !musicOn) { nextBar = actx ? actx.currentTime + 0.1 : 0; return; }
  scheduleMusic();
}
function toggleMusic() {
  if (!actx) initAudio();
  musicOn = !musicOn;
  try { localStorage.setItem("frog_music", musicOn ? "1" : "0"); } catch (e) {}
  if (master) master.gain.value = musicOn ? 0.42 : 0;
  musicBtn.textContent = musicOn ? "🔊" : "🔇";
  musicBtn.classList.toggle("off", !musicOn);
  if (musicOn) nextBar = actx.currentTime + 0.1;
}
musicBtn.textContent = musicOn ? "🔊" : "🔇";
musicBtn.classList.toggle("off", !musicOn);
musicBtn.addEventListener("click", toggleMusic);

// ---------- Overlay / menus ----------
const overlay = document.getElementById("overlay");
const ovButtons = document.getElementById("ov-buttons");
function clearButtons() { ovButtons.innerHTML = ""; }
function showOverlay(title, html) {
  document.getElementById("ov-title").textContent = title;
  document.getElementById("ov-text").innerHTML = html;
  overlay.classList.add("show");
}
function hideOverlay() { overlay.classList.remove("show"); }
function showMenu() {
  score = 0; lives = 4; crossings = 0; timer = 0;
  timerMax = DIFFS[diffIdx].timerMax;
  spawnFrog();
  spawnCarsAndLogs();
  state = "menu";
  document.getElementById("ov-title").textContent = "FROGGER";
  document.getElementById("ov-text").innerHTML = "Choisis une difficulté pour commencer";
  clearButtons();
  DIFFS.forEach((d, i) => {
    const b = document.createElement("button");
    b.className = "menu-btn" + (i === diffIdx ? " sel" : "");
    b.innerHTML = "<b>" + d.name + "</b><br><small>" + d.sub + "</small>";
    b.addEventListener("click", (e) => {
      e.stopPropagation();
      if (!actx) initAudio();
      diffIdx = i;
      reset();
    });
    ovButtons.appendChild(b);
  });
  overlay.classList.add("show");
}

// ---------- Boucle ----------
function tick() {
  if (actx) updateMusic();
  update();
  draw();
  requestAnimationFrame(() => setTimeout(tick, 16));
}

// ---------- Clavier ----------
function startFromMenu(idx) {
  if (!actx) initAudio();
  diffIdx = idx;
  reset();
}
document.addEventListener("keydown", (e) => {
  const k = e.key;
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", " "].includes(k)) e.preventDefault();
  if (state === "menu") {
    if (k === "1" || k === "2" || k === "3") startFromMenu(Number(k) - 1);
    else if (k === "ArrowLeft" || k === "ArrowDown") { diffIdx = (diffIdx + 2) % DIFFS.length; syncMenu(); }
    else if (k === "ArrowRight" || k === "ArrowUp") { diffIdx = (diffIdx + 1) % DIFFS.length; syncMenu(); }
    else if (k === "Enter" || k === " ") startFromMenu(diffIdx);
    return;
  }
  if (state === "over" && restartOnKey) { showMenu(); return; }
  if (state !== "play") return;
  if (k === "ArrowUp") tryMove(0, -1);
  else if (k === "ArrowDown") tryMove(0, 1);
  else if (k === "ArrowLeft") tryMove(-1, 0);
  else if (k === "ArrowRight") tryMove(1, 0);
});
function syncMenu() {
  const btns = ovButtons.querySelectorAll(".menu-btn");
  btns.forEach((b, i) => b.classList.toggle("sel", i === diffIdx));
}

// ---------- Joystick tactile (tablette / smartphone) ----------
const dpad = document.getElementById("dpad");
function dpadStep(dx, dy) {
  if (state === "over" && restartOnKey) { showMenu(); return; }
  tryMove(dx, dy);
}
for (const b of dpad.querySelectorAll("button")) {
  const [dx, dy] = b.dataset.dir.split(",").map(Number);
  let hold = null;
  const start = (e) => { e.preventDefault(); dpadStep(dx, dy); hold = setInterval(() => dpadStep(dx, dy), 150); };
  const stop = (e) => { e.preventDefault(); if (hold) { clearInterval(hold); hold = null; } };
  b.addEventListener("pointerdown", start);
  b.addEventListener("pointerup", stop);
  b.addEventListener("pointercancel", stop);
  b.addEventListener("pointerleave", stop);
  b.addEventListener("contextmenu", (e) => e.preventDefault());
}
overlay.addEventListener("click", () => { if (state === "over" && restartOnKey) showMenu(); });
if (window.matchMedia("(pointer: coarse)").matches || window.innerWidth <= 700) {
  document.querySelector(".hint").textContent = "Joystick ci-dessous : diriger la grenouille · 4 grenouilles pour gagner";
}

// ---------- Start ----------
buildTextures();
showMenu();
tick();
</script>
