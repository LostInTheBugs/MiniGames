name: Release

on:
  push:
    tags:
      - "catadventure-20[0-9][0-9].[0-9][0-9].[0-9][0-9][0-9]"
      - "catadventure-20[0-9][0-9].[0-9][0-9].[0-9][0-9][0-9]-c*"
      - "floodcity-20[0-9][0-9].[0-9][0-9].[0-9][0-9][0-9]"
      - "floodcity-20[0-9][0-9].[0-9][0-9].[0-9][0-9][0-9]-c*"
      - "frogger-20[0-9][0-9].[0-9][0-9].[0-9][0-9][0-9]"
      - "frogger-20[0-9][0-9].[0-9][0-9].[0-9][0-9][0-9]-c*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract release notes from the game's CHANGELOG
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME}"
          GAME="${TAG%%-*}"          # catadventure | floodcity | frogger
          VER="${TAG#*-}"            # 2026.09.001 (with optional -cN suffix)
          NOTES_FILE=/tmp/notes.md
          if [ -f "$GAME/CHANGELOG.md" ]; then
            awk -v t="$VER" "index(\$0, t) && /^#/ {f=1; print; next} /^#+ *\[?20[0-9][0-9]\./ {if (f) exit} f {print}" "$GAME/CHANGELOG.md" > "$NOTES_FILE"
          fi
          [ -s "$NOTES_FILE" ] || echo "Release $TAG" > "$NOTES_FILE"
          echo "----- release notes -----"
          cat "$NOTES_FILE"
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: /tmp/notes.md
          generate_release_notes: true
